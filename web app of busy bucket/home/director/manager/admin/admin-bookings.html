<body>

<div class="frame">
  <div class="scroll-area">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">Busy Bucket · Admin App</div>
    </div>
    <div class="title">Booking Details</div>
    <div class="subtitle">Mohali team · 23 Jul 2026</div>
  </div>

  <div class="body">

    <div class="stats-wrap">
      <div class="grid-2">
        <div class="stat-card">
          <div class="s-label">Active Partners</div>
          <div class="s-value">18</div>
        </div>
        <div class="stat-card gold">
          <div class="s-label">Pending Approval</div>
          <div class="s-value">3</div>
        </div>
        <div class="stat-card">
          <div class="s-label">Jobs Aaj</div>
          <div class="s-value">2</div>
        </div>
        <div class="stat-card green">
          <div class="s-label">Total Booking Amount</div>
          <div class="s-value">₹1.2L</div>
        </div>
      </div>
    </div>

    <div class="section-label">Booking Details</div>
    <div class="chip-row" id="chipRow">
      <button class="chip active" data-tab="today" onclick="setTab('today')">Todays Bookings</button>
      <button class="chip" data-tab="running" onclick="setTab('running')">Running Bookings</button>
      <button class="chip" data-tab="all" onclick="setTab('all')">All Bookings</button>
    </div>

    <div class="booking-list" id="bookingList"></div>

  </div>

  </div><!-- /.scroll-area -->

  <div class="bottom-nav">
    <a href="admin-try.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5B6B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      Dashboard

    <a href="admin-attendance.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5B6B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Attendance
    </a>
    <a href="admin-bookings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5B6B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Bookings
    </a>
  </div>
</div>

<!-- Booking detail modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="modalService">Home Cleaning</div>
        <div class="modal-sub" id="modalDateTime">23 Jul · 5:00 PM - 6:00 PM</div>
      </div>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#122019" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-rows" id="modalRows"></div>
  </div>
</div>

<script src="admin-booking.js"></script>
